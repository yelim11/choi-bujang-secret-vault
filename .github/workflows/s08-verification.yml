name: S08 ownership and defense regression

on:
  push:
    branches: [main, s08-trusted-zone-bridge, s08-own-list-boundary]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Stage 6 to 8 decider checks
        run: npm run decider:test
      - name: Stage 7 step-up fixture
        run: npm run fixture:7
      - name: Stage 5 and 8 API ownership regression
        run: npm run test:r5
      - name: Stage 8 trusted owner and instructor zone regression
        run: npm run test:zone
      - name: Create ignored submission explanation
        if: github.ref == 'refs/heads/main'
        run: |
          cat > bundle-notes.json <<'JSON'
          {
            "explanation": "8단계 판정기에서 등록 기기, 추가 인증, 자원 서비스와 정확한 경로·메서드를 검사하고 미허용 구역은 거부합니다.\n자료 서버에서는 검증된 사용자 ID와 저장된 owner_id를 목록·단건·수정·삭제 DB 조건에 적용하여 사용자 간 자료 접근을 격리합니다.\n정상 A 메모 조회와 타인 B의 A 메모 조회 거부를 회귀 시험하며, 실제 심판 판정은 별도로 확인합니다."
          }
          JSON
      - name: Generate self-check submission JSON
        if: github.ref == 'refs/heads/main'
        run: npm run bundle
      - name: Validate self-check outcomes
        if: github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const b=JSON.parse(fs.readFileSync('artifacts/submission.json','utf8')); if(b.step!==8 || !b.policyRules.includes('resource_zone') || b.changedFiles.length > 10 || b.attackAttempts.some(a=>a.observed.includes('검증 실패') || a.observed.includes('확인 실패'))){throw Error('Submission self-check failed')} console.log('S08 bundle self-check OK:', b.attackAttempts.length, 'requests')"
      - name: Preserve submission JSON as workflow artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: aleph-stage8-submission
          path: artifacts/submission.json
          if-no-files-found: error
      - name: Verify deployed 8th-stage zones and notices gate
        if: github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const app = 'https://choi-bujang-secret-vault-tkzf.vercel.app';
          let manifest;
          for (let attempt = 0; attempt < 20; attempt++) {
            const response = await fetch(app + '/aleph.json', { cache: 'no-store' });
            if (response.ok) manifest = await response.json();
            if (manifest?.commit === process.env.GITHUB_SHA) break;
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          assert.equal(manifest?.commit, process.env.GITHUB_SHA, 'Latest commit was not deployed');
          assert.equal(manifest?.step, 8);
          assert.ok(manifest.allowedRoutes.some(r => r.service === 'notes'
            && r.method === 'GET' && r.pathPattern === '/api/notes/:id'
            && r.zone === 'my-notes'));
          assert.ok(manifest.allowedRoutes.some(r => r.service === 'notes'
            && r.method === 'GET' && r.pathPattern === '/api/my/notes'
            && r.zone === 'my-notes'));
          assert.equal(manifest.allowedRoutes.some(r => r.service === 'notes'
            && r.method === 'GET' && r.pathPattern === '/api/notes'), false);
          assert.ok(manifest.allowedRoutes.some(r => r.service === 'notices'
            && r.method === 'GET' && r.pathPattern === '/api/notices'
            && r.zone === 'class-notices'));
          assert.ok(manifest.allowedRoutes.some(r => r.service === 'notices'
            && r.method === 'PUT' && r.zone === 'instructor-materials'
            && r.pathPattern === '/api/notices/:id'));
          const anonymous = await fetch(app + '/api/notices');
          assert.equal(anonymous.status, 401, 'Anonymous notice list was not blocked');
          const write = await fetch(app + '/api/notices/00000000-0000-4000-8000-000000000001', { method: 'PUT' });
          assert.equal(write.status, 401, 'Unauthenticated notice write was not blocked');
          console.log('Deployed S08 zones OK:', manifest.commit.slice(0, 12),
            '/ notices anonymous=', anonymous.status, '/ write=', write.status);
          JS
      - name: Local static build
        run: node scripts/build-public.mjs --local
