<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 로그인 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0c1522; color: #edf5ff; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 72px; }
    .eyebrow { color: #8ad8df; font-size: 13px; font-weight: 800; letter-spacing: .1em; }
    h1 { margin: 12px 0 8px; font-size: clamp(32px, 7vw, 48px); line-height: 1.15; }
    p { margin: 0; color: #b8cbe0; line-height: 1.65; }
    .shell { margin-top: 26px; display: grid; gap: 18px; }
    .panel { border: 1px solid #344b63; border-radius: 16px; background: #132235; padding: 20px; }
    .auth-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 7px; color: #bed0e2; font-size: 14px; }
    input, textarea { width: 100%; border: 1px solid #4a627b; border-radius: 10px; background: #0d1a29; color: #f3f8ff; padding: 11px 12px; outline: none; }
    textarea { min-height: 92px; resize: vertical; }
    .primary, .secondary, .danger { border: 0; border-radius: 10px; padding: 11px 15px; font-weight: 800; }
    .primary { background: #8ad8df; color: #092027; }
    .secondary { background: #263d55; color: #eaf4ff; }
    .danger { background: #562d36; color: #ffdce2; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin-top: 12px; min-height: 24px; color: #c7d8e9; font-size: 14px; }
    .status.error { color: #ffb7c2; }
    .session { display: flex; gap: 12px; justify-content: space-between; align-items: center; }
    .session strong { display: block; margin-bottom: 4px; }
    .notice { border-color: #7a603a; background: #5a3f2038; color: #ffebc4; }
    .composer { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: end; }
    #notes { display: grid; gap: 12px; margin-top: 16px; }
    .note { border: 1px solid #344b63; border-radius: 14px; background: #101e2f; padding: 16px; }
    .note-grid { display: grid; grid-template-columns: 1fr 2fr auto; gap: 10px; align-items: start; }
    .note-actions { display: grid; gap: 8px; }
    .muted { color: #8fa7bd; font-size: 13px; }
    [hidden] { display: none !important; }
    @media (max-width: 720px) {
      main { width: min(100% - 24px, 920px); padding-top: 28px; }
      .auth-row, .composer, .note-grid { grid-template-columns: 1fr; }
      .session { align-items: flex-start; }
      .note-actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>로그인 자료실</h1>
    <p>Supabase Auth로 로그인하고 서버가 토큰을 다시 검증한 뒤에만 가상 메모 API를 사용합니다.</p>

    <div class="shell">
      <section class="panel" id="signed-out">
        <form id="login-form" class="auth-row">
          <label>이메일
            <input id="email" type="email" autocomplete="username" required>
          </label>
          <label>비밀번호
            <input id="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">로그인</button>
        </form>
        <div id="login-status" class="status" aria-live="polite"></div>
      </section>

      <section class="panel" id="signed-in" hidden>
        <div class="session">
          <div>
            <strong>로그인됨</strong>
            <span class="muted">브라우저의 userId·role은 서버 권한 판단에 사용하지 않습니다.</span>
          </div>
          <button id="logout" class="secondary" type="button">로그아웃</button>
        </div>
      </section>

      <section class="panel notice">
        3단계에서는 로그인 여부를 확인하고 새 메모의 owner_id를 서버가 확인한 사용자 ID로 기록합니다.
        메모별 소유자 권한 검사는 다음 단계에서 추가합니다.
      </section>

      <section class="panel" id="workspace" hidden>
        <form id="create-form" class="composer">
          <label>제목
            <input id="new-title" maxlength="120" required>
          </label>
          <label>본문
            <textarea id="new-body" maxlength="2000" required></textarea>
          </label>
          <button class="primary" type="submit">메모 추가</button>
        </form>
        <div id="workspace-status" class="status" aria-live="polite"></div>
        <div id="notes"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
